            /** Builds the row with columns from the specified names.
             *  If the item parameter is specified, the memebers of the names array will be used as property names of the item; otherwise they will be directly parsed as text.
             */
            function _buildRowColumns(names, item) {
                var row = '<tr  bgcolor="lightgray">';
                if (names && names.length > 0)
                {
                    $.each(names, function(index, name) {
                        var c = item ? item[name+''] : name;
                        var curow = '<td>' + c + '</td>';
                        if (c==='System'){
                            row = '<tr bgcolor="darkgray">';
                        }
                        if (curow.includes('Aetolians')) {
                            curow = '<td bgcolor="palegreen">' + c + '</td>';
                        }
//                        if (curow.includes(':')) {
//                            curow = '<td bgcolor="white">' + c + '</td>';
//                        }
                        if (curow.includes('ELITE SPACE WINGS')||curow.includes('Brazilian League of Pilots')) {
                            curow = '<td bgcolor="red">' + c + '</td>';
                        }
                        if (c==6 || c==5) {
                            curow = '<td bgcolor="darkgreen">' + c + '</td>';
                        }
                        if (curow.includes('Boom')) {
                            curow = '<td bgcolor="palegreen">' + c + '</td>';
                        }
                        if (curow.includes('Expansion')) {
                            curow = '<td bgcolor="lightblue">' + c + '</td>';
                        }
                        row += curow;//'<td>' + c + '</td>';

                    });
                }
                row += '</tr>';
                return row;
            }
            
            /** Builds and sets the headers of the table. */
            function _setHeaders() {
                // if no headers specified, we will use the fields as headers.
                _headers = (_headers == null || _headers.length < 1) ? _fields : _headers;
                var h = _buildRowColumns(_headers);
                if (_table.children('thead').length < 1) _table.prepend('<thead></thead>');
                _table.children('thead').html(h);
            }
            
            function _setNoItemsInfo() {
                if (_table.length < 1) return; //not configured.
                var colspan = _headers != null && _headers.length > 0 ?
                    'colspan="' + _headers.length + '"' : '';
                var content = '<tr class="no-items"><td ' + colspan + ' style="text-align:center">' +
                    _defaultText + '</td></tr>';
                if (_table.children('tbody').length > 0)
                    _table.children('tbody').html(content);
                else _table.append('<tbody>' + content + '</tbody>');
            }
            
            function _removeNoItemsInfo() {
                var c = _table.children('tbody').children('tr');
                if (c.length == 1 && c.hasClass('no-items')) _table.children('tbody').empty();
            }
            
            return {
                /** Configres the dynamic table. */
                config: function(tableId, fields, headers, defaultText) {
                    _tableId = tableId;
                    _table = $('#' + tableId);
                    _fields = fields || null;
                    _headers = headers || null;
                    _defaultText = defaultText || 'No items to list...';
                    _setHeaders();
                    _setNoItemsInfo();
                    return this;
                },
                /** Loads the specified data to the table body. */
                load: function(data, append) {
                    if (_table.length < 1) return; //not configured.
                    _setHeaders();
                    _removeNoItemsInfo();
                    if (data && data.length > 0) {
                        var rows = '';
                        $.each(data, function(index, item) {
                            rows += _buildRowColumns(_fields, item);
                        });
                        var mthd = append ? 'append' : 'html';
                        _table.children('tbody')[mthd](rows);
                    }
                    else {
                        _setNoItemsInfo();
                    }
                    return this;
                },
                /** Clears the table body. */
                clear: function() {
                    _setNoItemsInfo();
                    return this;
                }
            };
        }());
        
        // distance funtion
        function dist3d (source,target) {
            var d = 0;
            for (let i=0; i<3; i++) {
                var cur = Number(source[i]);
                var tar = Number(target[i]);
                var delta = cur - tar;
                var squared = delta * delta;
                d = d + squared;
            }
            d = Math.sqrt(d);
            return d;
        }

                }

                }
            }
            return pbCalced;        
        }

        function getDaysBetweenDates(dateStr1, dateStr2) {
            // const days = getDaysBetweenDates("2026-07-01", "2026-07-07");
            // 1. Create Date objects
            const d1 = new Date(dateStr1);
            const d2 = new Date(dateStr2);
            
            // 2. Normalize by setting the time to midnight (prevents issues with local timezones)
            d1.setHours(0, 0, 0, 0);
            d2.setHours(0, 0, 0, 0);
            
            // 3. Milliseconds in one day: 24 hr * 60 min * 60 sec * 1000 ms
            const msPerDay = 24 * 60 * 60 * 1000;
            
            // 4. Calculate absolute difference in milliseconds and convert to days
            const diffInMs = Math.abs(d2 - d1);
            
            // 5. Round to the nearest whole number
            return Math.round(diffInMs / msPerDay);
        }
        
        function getLastSaturday() {
            // console.log(getLastSaturday().toDateString());
            const today = new Date();
            const dayOfWeek = today.getDay(); // Sunday is 0, Monday is 1, ..., Saturday is 6
            
            // Calculate how many days to subtract to reach the most recent Saturday
            // If today is Sunday (0), we go back 1 day. If today is Saturday (6), we go back 7 days.
            const daysToSubtract = dayOfWeek === 0 ? 1 : dayOfWeek + 1;
            
            // Create a new Date object representing last Saturday
            const lastSaturday = new Date(today);
            lastSaturday.setDate(today.getDate() - daysToSubtract);
            
            return lastSaturday;
        }
